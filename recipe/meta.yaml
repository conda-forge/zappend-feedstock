{% set python_min = "3.11" %}
{% set name = "zappend" %}
{% set version = "0.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4237a7b2d0f85a97e83957d914e7b85f17bb05663c0f3689e4627ed36b8f203e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - zappend = zappend.cli:zappend

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=40.9.0
    - pip
  run:
    - python >={{ python_min }}
    - click
    - dask
    - fsspec
    - jsonschema
    - numcodecs
    - numpy
    - pyyaml
    - xarray
    - zarr >=3,<4

test:
  imports:
    - zappend
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://bcdev.github.io/zappend
  summary: Tool for creating and updating Zarr datacubes from smaller slices
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - konstntokas
    - forman
    - pont-us
    - TejasMorbagal
    - thomasstorm
    - TonioF
